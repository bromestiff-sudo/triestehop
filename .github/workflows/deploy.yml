name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir dist
          cp index.html manifest.webmanifest icon.svg icon-*.png og.png dist/

      - name: Publish to triestehop.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set yet: skipping the deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=triestehop --branch=main --commit-dirty=true
