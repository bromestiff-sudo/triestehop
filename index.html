*{box-sizing:border-box}
/* Layout: one fixed 480x288 stage scaled to fit; DOM menus float over the canvas; touch pad pinned to the screen corners */
:root{

  --ink:#fff7e6;        /* warm paper white */

  --tomato:#ff5a3c;     /* Girandolo's coat */

  --shade:rgba(24,14,44,.72);
  --display:'Chango','Arial Black',Impact,sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --u:1px;
  color-scheme:dark;
}
html,body{height:100%;touch-action:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;box-shadow:0 0 0 calc(var(--u)*2) #120b22,0 calc(var(--u)*10) calc(var(--u)*40) rgba(0,0,0,.5);overflow:hidden;border-radius:calc(var(--u)*6)}
canvas{display:block;width:100%;height:100%}
#screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*8);text-align:center;padding:calc(var(--u)*14)}
#screen.dim{background:var(--shade)}
#screen[hidden]{display:none!important}
.big{font-family:var(--display);font-size:calc(var(--u)*44);line-height:1;color:var(--sun);letter-spacing:.02em;text-shadow:0 calc(var(--u)*3) 0 var(--tomato),0 calc(var(--u)*6) 0 #120b22;text-wrap:balance;margin:0}
.mid{font-family:var(--display);font-size:calc(var(--u)*22);line-height:1.1;color:var(--sun);text-shadow:0 calc(var(--u)*2) 0 #120b22;margin:0;text-wrap:balance}
.txt{font-size:calc(var(--u)*12.5);line-height:1.35;max-width:calc(var(--u)*360);margin:0;font-weight:500;text-shadow:0 1px 2px #120b22,0 0 6px rgba(18,11,34,.85)}
.scene{display:flex;flex-direction:column;gap:calc(var(--u)*3);max-width:calc(var(--u)*410);text-align:left;background:rgba(18,11,34,.55);border-radius:calc(var(--u)*8);padding:calc(var(--u)*7) calc(var(--u)*10)}
.line{margin:0;font-size:calc(var(--u)*10.6);line-height:1.32}
.line b{color:var(--sun);font-weight:800}
.line.narr{font-style:italic;opacity:.85}
.story{font-size:calc(var(--u)*11);line-height:1.38;max-width:calc(var(--u)*420);text-align:left;background:rgba(18,11,34,.55);border-radius:calc(var(--u)*8);padding:calc(var(--u)*7) calc(var(--u)*11)}
.inst{text-align:left;margin:0;padding-left:calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*4);max-width:calc(var(--u)*400);font-size:calc(var(--u)*11.5)}
.tip{font-size:calc(var(--u)*10.6);color:var(--sun)}
.small{font-size:calc(var(--u)*10);margin:0;letter-spacing:.04em;text-shadow:0 1px 2px #120b22,0 0 6px rgba(18,11,34,.9)}
.row{display:flex;gap:calc(var(--u)*6);flex-wrap:wrap;justify-content:center}
button.b{font-family:var(--body);font-weight:800;font-size:calc(var(--u)*13);letter-spacing:.06em;text-transform:uppercase;color:#1e1233;background:var(--sun);border:0;border-radius:calc(var(--u)*999);padding:calc(var(--u)*6) calc(var(--u)*18);box-shadow:0 calc(var(--u)*3) 0 #b8860b;cursor:pointer}
button.b.alt{background:var(--ink);box-shadow:0 calc(var(--u)*3) 0 #9d8f78}
button.b.on{background:var(--tomato);color:var(--ink);box-shadow:0 calc(var(--u)*3) 0 #9e2b16}
button.b:active{transform:translateY(calc(var(--u)*2));box-shadow:none}
button.b:focus-visible,button.lv:focus-visible{outline:calc(var(--u)*2) solid var(--ink);outline-offset:calc(var(--u)*2)}
button.lv{font-family:var(--display);font-size:calc(var(--u)*14);width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:calc(var(--u)*8);border:0;background:var(--ink);color:#1e1233;box-shadow:0 calc(var(--u)*3) 0 #9d8f78;cursor:pointer}
button.lv:disabled{opacity:.35;cursor:default}
.kanji{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;font-size:calc(var(--u)*96);color:var(--sun);line-height:1;margin:0;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.studio{font-family:var(--display);font-size:calc(var(--u)*14);letter-spacing:.35em;margin:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.kanji{animation:none}}
#pauseBtn{position:absolute;top:calc(var(--u)*6);right:calc(var(--u)*6);width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%;border:0;background:rgba(18,11,34,.55);color:var(--ink);font-weight:800;font-size:calc(var(--u)*11);cursor:pointer}
#pauseBtn[hidden]{display:none}
#rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
#rotate .ph{width:54px;height:92px;border:4px solid var(--sun);border-radius:12px;position:relative;animation:turn 2.2s ease-in-out infinite}
#rotate .ph::after{content:"";position:absolute;bottom:6px;left:50%;width:12px;height:3px;margin-left:-6px;border-radius:2px;background:var(--sun)}
#rotate h2{font-family:var(--display);color:var(--sun);font-size:26px;margin:0;line-height:1.1}
#rotate p{margin:0;font-size:16px;font-weight:700;max-width:280px}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#touch{position:fixed;inset:auto 0 0 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#touch[hidden]{display:none}
#touch .grp{display:flex;gap:12px;pointer-events:auto}
#touch button{width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,247,230,.55);background:rgba(18,11,34,.38);color:var(--ink);font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.04em;touch-action:none}
#touch button.hold{background:rgba(255,210,63,.55);color:#1e1233}
#touch .grp.r button:last-child{transform:translateY(-26px)}
</style>

<script>
(()=>{
'use strict';
/* ---------------- constants ---------------- */
const W=480,H=288,T=24,ROWS=12;
const G=1100,JUMP=-465,MAXV=150,ACC=900,AIRACC=620,FRIC=1050,GLIDE=46,MAXFALL=560,STAM=1.4,SPRING=-650;

/* ---------------- text (IT / EN / ES) ---------------- */
const STR={
 it:{tag:'Le avventure saltellanti di Sua Eccellenza.',play:'Gioca',levels:'Livelli',sound:'Suono',on:'sì',off:'no',
  keys:'← → cammina · SPAZIO salta · X gira (tieni premuto)',go:'Via!',lvl:'Livello',
  done:'Livello completato!',next:'Avanti',menu:'Menu',retry:'Riprova',over:'Inciampato!',
  overTxt:'Le gambe hanno girato un po\' troppo. Riprova il livello.',pause:'Pausa',resume:'Riprendi',restart:'Ricomincia',
  time:'Tempo',jump:'SALTA',spin:'GIRA',bakery:'CAFFÈ',
  intro:'Negli uffici di Chiurlo lavorava Srancesco Faverio Freddi, addetto alla fatturazione. A ogni conguaglio sbagliato tirava giù tutto il calendario dei santi, e i colleghi mettevano le cuffie. Un giorno, davanti all\'ennesimo file Excel che non si apriva, la stampante si accese da sola e stampò una sola parola: «BASTA». Era un segno. Oggi è Sua Eccellenza il Cardinal Freddi (insiste con «Eccellenza», anche se ai cardinali spetterebbe «Eminenza»). Lo guida il suo mentore, Papa Faniele Daidiga, che gli insegna a non bestemmiare e a fatturare correttamente. Ma il suo arcinemico giurato, Monsignor Alderto Ambretto, trama nell\'ombra per farlo ricadere nel peccato... e negli errori di fatturazione.',introT:'La conversione di Srancesco',cont:'Avanti',story:['I piccioni di Piazza Unità se lo ricordano bene: anni di imprecazioni sotto i loro nidi. Ora vogliono vendetta.','La bora soffia sulle Rive e riporta indietro, una a una, tutte le sue vecchie parolacce. Saltale, e soprattutto non ripeterle.','Nel Canal Grande vivono le granzievole che lo videro lanciare in acqua la calcolatrice dell\'ufficio. Non hanno dimenticato.','Nei magazzini del Porto Vecchio è archiviata ogni fattura sbagliata della sua vecchia vita. Le pile di carta crollano sotto i piedi.','In cima a San Giusto suonano le campane: è l\'ora della confessione. La salita è lunga e i gradini si sbriciolano.','Barcola, notte. Il caffè storico è vicino. Ma sul bancone, accanto al nero, qualcuno ha lasciato una bolletta da verificare.'],
  end:'Freddi legge la bolletta riga per riga. Respira. «Il conguaglio è giusto. L\'errore l\'ha messo lei, Monsignore.» Ambretto, smascherato, viene trasferito all\'ufficio reclami di Chiurlo. Papa Daidiga alza la tazzina: «Bravo, Srancesco. Nessuna bestemmia, fattura corretta». Il giorno dopo da Chiurlo lo chiamano per un file che non quadra. Lui risponde soltanto: «Pace e bene. Mandatemelo in PDF».',endT:'Miracolo a Trieste!',
  names:['Piazza Unità','Le Rive','Canal Grande','Porto Vecchio','San Giusto','Barcola di notte'],
  tips:['Salta i buchi e schiaccia i piccioni di Piazza Unità saltandoci sopra. Le colonne isolate vogliono salti precisi.','Arriva la bora e i gabbiani picchiano dall\'alto. Le pile di fatture crollano mezzo secondo dopo che ci sali: non fermarti sopra.','Le granzievole spinose non si schiacciano: prendile a calci mentre giri. Spuntoni anche sul soffitto: lì servono salti corti.','Prendi l\'ascensore del magazzino al momento giusto. Acqua profonda, carta che crolla e piattaforme mobili.','Sali a zigzag sopra gli spuntoni e corri sui gradini che si sbriciolano. Le molle ti sparano verso il castello.','Ultimo tratto, al buio, sotto il Faro della Vittoria: gabbiani sui burroni e salti lunghi da fare planando con GIRA.'],
  scenes:[[["", "Piazza Unità, ore 8. Sua Eccellenza esce dalla curia con le mani in tasca."], ["Piccione capo", "Rrrú! È lui! Quello che ci urlava contro dalle finestre di Chiurlo!"], ["Sua Eccellenza", "Fratelli piccioni, sono un uomo nuovo. Pace e bene."], ["Piccione capo", "Rrrú. Attaccate."]], [["", "Sulle Rive si alza la bora. Nel vento si sentono voci familiari..."], ["Vecchia parolaccia", "Ti ricordi di noi? Siamo quelle del giorno della chiusura di bilancio!"], ["Sua Eccellenza", "Non vi conosco. Andate a soffiare a Muggia."]], [["", "Canal Grande. Dall'acqua emerge una granzievola anziana."], ["Granzievola", "Anni fa ci hai tirato in testa la calcolatrice dell'ufficio. Ce l'abbiamo ancora."], ["Sua Eccellenza", "Era una scientifica. Vi chiedo perdono."], ["Granzievola", "Perdono negato. Chele in alto!"]], [["", "Porto Vecchio. Montagne di fatture stampate e mai archiviate."], ["Fattura n. 4417", "Io sono il conguaglio che non quadrava. Mi hai fissato tre ore e poi hai detto... quella cosa."], ["Sua Eccellenza", "Quella cosa l'ha detta un altro me. Ora vado di fretta."]], [["", "Colle di San Giusto. Le campane suonano per lui."], ["Campanile", "DON. Confessione. DON. Adesso. DON."], ["Sua Eccellenza", "Arrivo! Sono un cardinale, non uno stambecco!"]], [["", "Barcola, notte. Il Faro della Vittoria illumina la strada verso il caffè."], ["Cameriere", "Eccellenza, il suo nero è pronto. C'è anche... una bolletta. L'ha lasciata un signore di Chiurlo."], ["Sua Eccellenza", "La tentazione finale. Arrivo."]]],quips:["Respira, salta, non imprecare.", "Chi fattura bene non impreca.", "Scusate per la calcolatrice!", "Ambretto ha spostato un decimale...", "Ogni gradino è una penitenza.", "Non pensare al conguaglio, Srancesco."],outros:["In Municipio ricevono la dichiarazione. Il funzionario la timbra e commenta: «È la prima pratica di Chiurlo che arriva senza un errore». Dietro una colonna, Ambretto stringe i pugni.", "La bora si calma. Una sola vecchia bestemmia è rimasta impigliata a un lampione del molo: Freddi la benedice e la lascia lì, come monito. Ambretto se ne va bagnato fradicio.", "Le campane di Sant'Antonio suonano mezzogiorno e le granzievole tornano in acqua, borbottando di un ricorso al TAR. Sul fondo del canale brilla qualcosa: è la vecchia calcolatrice. Freddi la ripesca. Funziona ancora.", "Nell'ultima pila Freddi trova l'archivio di Ambretto. Con la calcolatrice ripescata ricontrolla tutto: errori corretti, note di credito emesse. Papa Daidiga approva con un vocale: «Così si fattura».", "In cima al campanile Ambretto si arrende... ma solo per finta. Mentre Freddi si confessa, scivola giù per le scale verso il mare. Il Papa, ancora senza fiato: «Barcola. Il caffè. Corri».", ""],stories:["Prima missione: consegnare in Municipio la dichiarazione di conversione, firmata da Papa Daidiga in persona. Ma per mesi Monsignor Ambretto ha sparso briciole davanti alla sede di Chiurlo: ora i piccioni di Piazza Unità obbediscono a lui e hanno l'ordine di non far passare il cardinale. Una sola imprecazione e la conversione salta. Il Papa gli ha scritto sul palmo della mano: «Respira, salta, non imprecare».", "Ambretto ha scoperto che la bora porta lontano le parole. Dal Molo Audace ha liberato tutte le vecchie bestemmie di Freddi, registrate di nascosto in anni di chiusure di bilancio da Chiurlo, e ora le raffiche gliele soffiano contro una dopo l'altra. Sulle Rive ha lasciato anche pile di fatture che crollano al primo passo. Papa Daidiga lo chiama: «Srancesco, ricorda: chi fattura bene non ha bisogno di imprecare».", "Ambretto ha corrotto le granzievole del Canal Grande con un sacchetto di cozze. Sono le stesse che anni fa videro Freddi lanciare in acqua la calcolatrice dell'ufficio, dopo un conguaglio di Chiurlo che non tornava. Hanno buona memoria e chele affilate. Il Papa gli manda un messaggio: «Non provare a schiacciarle, hanno le spine. Gira e scalcia, con amore».", "Nel magazzino 26 del Porto Vecchio, Ambretto nasconde un archivio segreto: tutte le fatture sbagliate che Freddi emise ai tempi di Chiurlo, pronte per essere spedite all'Agenzia delle Entrate. Freddi deve arrivarci prima di lui. Le pile di carta crollano sotto i piedi e l'ascensore del magazzino va preso al volo. Papa Daidiga avverte: «Controlla gli importi, Srancesco. Ambretto ha spostato un decimale».", "Smascherato, Monsignor Ambretto si è barricato nel campanile di San Giusto e minaccia di suonare le campane finché Freddi non ammetterà, davanti a tutta Trieste, di aver sbagliato un'aliquota IVA nel lontano 2019. Papa Daidiga sale con lui, ma a metà salita si ferma col fiatone: «Vai avanti tu, figliolo. E non dire niente quando i gradini si sbriciolano».", "Ambretto è fuggito a Barcola e ha preso in ostaggio l'ultimo nero del caffè storico. Sul bancone, accanto alla tazzina, ha lasciato l'ultima tentazione: una bolletta di Chiurlo con un conguaglio sbagliato apposta. Se Freddi impreca, perde tutto. Papa Daidiga gli scrive l'ultimo messaggio: «Leggi riga per riga. Respira. Poi bevi il caffè»."],
  cornetti:'Chicchi di caffè'},
 en:{tag:'The hopping adventures of His Excellency.',play:'Play',levels:'Levels',sound:'Sound',on:'on',off:'off',
  keys:'← → walk · SPACE jump · X spin (hold)',go:'Go!',lvl:'Level',
  done:'Level complete!',next:'Next',menu:'Menu',retry:'Retry',over:'Tripped!',
  overTxt:'Those legs spun one turn too many. Try the level again.',pause:'Paused',resume:'Resume',restart:'Restart',
  time:'Time',jump:'JUMP',spin:'SPIN',bakery:'CAFFÈ',
  intro:'In the Chiurlo offices there was a clerk who cursed every saint in the calendar whenever an invoice adjustment came out wrong. One day, staring at yet another Excel file that wouldn\'t open, the printer switched itself on and printed a single word: "ENOUGH". That was his conversion. Today he is His Excellency the Cardinal (he insists on "Excellency", even though cardinals are properly "Eminence"). He hops along with his hands in his pockets, on a mission: cross Trieste to the historic café without saying a single swear word.',introT:'The conversion',cont:'Next',story:['The pigeons of Unity Square remember him well: years of cursing under their nests. Now they want revenge.','The bora blows along the waterfront and brings back, one by one, all his old swear words. Jump over them, and above all don\'t repeat them.','The spider crabs of the Grand Canal saw him throw the office calculator into the water. They have not forgotten.','The Old Port warehouses hold every wrong invoice of his former life. The paper stacks collapse under your feet.','The bells ring at the top of San Giusto: time for confession. The climb is long and the steps crumble.','Barcola, night. The historic café is close. But on the counter, next to the espresso, someone has left a bill to check.'],
  end:'His Excellency drinks his espresso, looks at the bill and smiles: "The adjustment is correct." For the first time in his life, not a single curse. The next day Chiurlo calls him about a file that doesn\'t add up. He only replies: "Peace be with you. Send it to me as a PDF."',endT:'A miracle in Trieste!',
  names:['Unity Square','The Waterfront','The Grand Canal','The Old Port','San Giusto Hill','Barcola by Night'],
  tips:['Jump over gaps and stomp the pigeons of Unity Square by landing on them. Lone pillars need precise jumps.','Here comes the bora, and seagulls dive from above. Invoice stacks collapse half a second after you step on them: don\'t stop.','Spiny spider crabs can\'t be stomped: kick them while you spin. Spikes on the ceiling too: use short hops there.','Catch the warehouse lift at the right moment. Deep water, collapsing paper and moving platforms.','Zigzag up above the spikes and run over the crumbling steps. Springs launch you toward the castle.','The last stretch, in the dark, under the Victory Lighthouse: seagulls over the gaps and long jumps to glide with SPIN.'],
  scenes:[[["", "Unity Square, 8 a.m. His Excellency leaves the curia with his hands in his pockets."], ["Pigeon boss", "Coo! It's him! The one who yelled at us from the Chiurlo windows!"], ["His Excellency", "Brother pigeons, I am a new man. Peace be with you."], ["Pigeon boss", "Coo. Attack."]], [["", "The bora rises along the waterfront. Familiar voices ride the wind..."], ["Old swear word", "Remember us? We're the ones from year-end closing day!"], ["His Excellency", "I don't know you. Go and blow on Muggia."]], [["", "The Grand Canal. An old spider crab rises from the water."], ["Spider crab", "Years ago you threw the office calculator at our heads. We still have it."], ["His Excellency", "It was a scientific one. I ask your forgiveness."], ["Spider crab", "Forgiveness denied. Claws up!"]], [["", "The Old Port. Mountains of invoices, printed and never filed."], ["Invoice no. 4417", "I'm the adjustment that didn't add up. You stared at me for three hours and then said... that thing."], ["His Excellency", "Another me said that thing. I'm in a hurry now."]], [["", "San Giusto Hill. The bells are ringing for him."], ["Bell tower", "DONG. Confession. DONG. Now. DONG."], ["His Excellency", "Coming! I'm a cardinal, not a mountain goat!"]], [["", "Barcola, night. The Victory Lighthouse lights the way to the café."], ["Waiter", "Your Excellency, your espresso is ready. There's also... a bill. A gentleman from Chiurlo left it."], ["His Excellency", "The final temptation. I'm coming."]]],quips:["I said nothing. I said NOTHING.", "By Barcola I'll be a saint. Maybe.", "Easy, Excellency. They're just crabs with a grudge.", "Who still prints invoices?!", "Every step is a penance.", "Don't think about the adjustment. Don't."],outros:["The pigeons retreat to the statue. One drops something on his cape. His Excellency counts to ten, and smiles.", "The bora calms down. A single swear word is left caught on a lamppost. His Excellency blesses it and leaves it there.", "The bells of Sant'Antonio ring noon. The spider crabs crawl back, muttering about an appeal to the regional court.", "A sheet slips out of the last stack: his resignation letter from Chiurlo. Signed, stamped, never delivered.", "He confesses in the cathedral for two hours. The confessor comes out pale and asks for a coffee. But the historic café is about to close...", ""],
  cornetti:'Coffee beans'},

function snd(f,d=.08,type='square',v=.06,slide=0,delay=0){
  if(muted) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t0=ac.currentTime+delay,o=ac.createOscillator(),gn=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);

    gn.gain.setValueAtTime(v,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(gn).connect(ac.destination);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}

const BEAT=.42,LOOP=CHORDS.length*3*BEAT;
const MUS=[];{let t=0;for(const [m,b] of MEL){MUS.push({t,k:'m',m,d:b*BEAT});t+=b*BEAT}

function musNote(e,when){

    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;f.connect(g2);

  }else if(e.k==='b'){

function musTick(){
  if(!ac||muted)return;

function startMusic(){
  if(muted)return;

    ac=ac||new (window.AudioContext||window.webkitAudioContext)();

function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%1000/1000;

/* ---------------- level building ---------------- */
let L=null,lvl=0;
function buildLevel(n){
  const r=rng(9137+n*7919);
  const th=THEMES[n];
  let pool=CH.filter(c=>c.min<=n);
  pool=pool.concat(pool.filter(c=>th.fav.includes(c.id)));
  const count=6+n*2,pieces=[START];
  let prev='';
  for(let i=0;i<count;i++){
    if(i===Math.floor(count/2)) pieces.push(CHECK);
    let c; do{c=pool[Math.floor(r()*pool.length)]}while(c.id===prev&&pool.length>1);
    // make sure each level's signature chunk appears at least once
    const fi={1:0,3:1,5:2,7:3}[i];if(fi!==undefined&&th.fav[fi]){const sig=CH.find(x=>x.id===th.fav[fi]);if(sig&&sig.min<=n)c=sig}
    prev=c.id; pieces.push(c.r);
  }
  pieces.push(END);
  const rows=Array.from({length:ROWS},()=>'');
  for(const p of pieces){
    const w=Math.max(...p.map(s=>s.length)),off=ROWS-p.length;
    for(let y=0;y<ROWS;y++){const s=y<off?'':p[y-off];rows[y]+=s.padEnd(w,' ')}
  }
  const lv={crumbles:new Map(),w:rows[0].length,t:[],coins:[],enemies:[],plats:[],springs:[],checks:[],door:null,start:{x:2*T,y:9*T},total:0,theme:th,deco:[]};
  for(let y=0;y<ROWS;y++){
    let line='';
    for(let x=0;x<rows[y].length;x++){
      const ch=rows[y][x];let keep=' ';
      if('#=-^~xv'.includes(ch)) keep=ch;
      else if(ch==='c'){lv.coins.push({x:x*T+12,y:y*T+12,got:false,ph:x*.7});lv.total++}
      else if(ch==='p') lv.enemies.push(mkEnemy('p',x,y));
      else if(ch==='s') lv.enemies.push(mkEnemy('s',x,y));
      else if(ch==='r') lv.enemies.push(mkEnemy('r',x,y));
      else if(ch==='M') lv.plats.push({x:x*T,x0:x*T,y:y*T,y0:y*T,w:3*T,h:9,range:3*T,t:x,dx:0,dy:0});
      else if(ch==='V') lv.plats.push({x:x*T,x0:x*T,y:y*T,y0:y*T,w:3*T,h:9,range:3*T,t:x,dx:0,dy:0,vert:true});
      else if(ch==='g') lv.enemies.push(mkEnemy('g',x,y));
      else if(ch==='B') lv.springs.push({x:x*T,y:y*T,sq:0});
      else if(ch==='K') lv.checks.push({x:x*T,y:(y+1)*T,on:false});
      else if(ch==='F') lv.door={x:x*T,y:(y+1)*T};
      else if(ch==='P') lv.start={x:x*T+4,y:(y+1)*T-24};
      line+=keep;
    }
    lv.t.push(line);
  }
  // parallax decoration
  const span=lv.w*T*.45+W;
  for(let x=-40;x<span;x+=50+r()*70){lv.deco.push({x,w:34+r()*30,h:36+r()*44,c:th.house[Math.floor(r()*th.house.length)],k:r()})}
  lv.stars=Array.from({length:50},()=>({x:r()*W,y:r()*H*.55,s:r()}));
  return lv;
}
function mkEnemy(t,x,y){
  const d={p:{w:14,h:13,sp:32},s:{w:16,h:13,sp:14},r:{w:18,h:10,sp:78},g:{w:16,h:10,sp:0}}[t];
  const ex=x*T+(T-d.w)/2,ey=(y+1)*T-d.h;
  return {x0:ex,y0:ey-6,seed:x*.7,type:t,x:x*T+(T-d.w)/2,y:(y+1)*T-d.h,w:d.w,h:d.h,vx:-d.sp,sp:d.sp,vy:0,dir:-1,alive:true,dead:0,rot:0,ph:Math.random()*6,ground:false};
}

/* ---------------- tile physics ---------------- */
const tile=(x,y)=>(x<0||x>=L.w)?'#':(y<0||y>=ROWS)?' ':L.t[y][x];
const solid=c=>c==='#'||c==='='||c==='x';
function setTile(x,y,c){L.t[y]=L.t[y].substring(0,x)+c+L.t[y].substring(x+1)}
function moveX(o,dx){
  o.x+=dx;
  const top=Math.floor(o.y/T),bot=Math.floor((o.y+o.h-.01)/T);
  if(dx>0){const tx=Math.floor((o.x+o.w)/T);for(let ty=top;ty<=bot;ty++)if(solid(tile(tx,ty))){o.x=tx*T-o.w-.01;o.vx=0;return true}}
  else if(dx<0){const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(solid(tile(tx,ty))){o.x=(tx+1)*T+.01;o.vx=0;return true}}
  return false;
}
function moveY(o,dy){
  const prevBot=o.y+o.h;o.y+=dy;o.ground=false;
  const l=Math.floor(o.x/T),r=Math.floor((o.x+o.w-.01)/T);
  if(dy>0){
    const ty=Math.floor((o.y+o.h)/T);
    for(let tx=l;tx<=r;tx++){const c=tile(tx,ty);
      if(solid(c)||(c==='-'&&prevBot<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.ground=true;return}}
    for(const p of L.plats){
      if(o.x+o.w>p.x&&o.x<p.x+p.w&&prevBot<=p.y+.5&&o.y+o.h>=p.y){o.y=p.y-o.h;o.vy=0;o.ground=true;o.plat=p;return}
    }
  }else if(dy<0){
    const ty=Math.floor(o.y/T);
    for(let tx=l;tx<=r;tx++)if(solid(tile(tx,ty))){o.y=(ty+1)*T;o.vy=0;return}
  }
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------- input ---------------- */
const keys={left:false,right:false,jump:false,spin:false,jumpPressed:false};
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',KeyX:'spin',ShiftLeft:'spin',ShiftRight:'spin',KeyK:'spin',KeyJ:'jump'};
addEventListener('keydown',e=>{
  if(e.code==='Enter'){const b=screen.querySelector('[data-primary]');if(b&&!screen.hidden){b.click();e.preventDefault()}return}
  if((e.code==='Escape'||e.code==='KeyP')&&(state==='play'||state==='pause')){togglePause();return}
  const k=KMAP[e.code];if(!k)return;
  if(state==='play'||state==='title') e.preventDefault();
  if(k==='jump'&&!keys.jump) keys.jumpPressed=true;
  keys[k]=true;
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const coarse=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
// iOS ignores user-scalable=no: block double-tap zoom and pinch zoom ourselves
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<400&&!(e.target.closest&&e.target.closest('#screen button,#pauseBtn')))e.preventDefault();lastTouchEnd=n},{passive:false});
touchPad.querySelectorAll('button').forEach(b=>{
  b.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  b.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();if(k==='jump'&&!keys.jump)keys.jumpPressed=true;keys[k]=true;b.classList.add('hold');try{b.setPointerCapture(e.pointerId)}catch(_){}}
  const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('hold')};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});

/* ---------------- game state ---------------- */
let bubbles=[];let state='splash',P=null,cam=0,parts=[],lives=3,timeL=0,stateT=0,flash=0,shake=0;
function newPlayer(x,y){return{x,y,w:14,h:24,vx:0,vy:0,dir:1,ground:false,phase:0,lastStep:0,spin:false,stam:STAM,coyote:0,buf:0,cut:false,dead:0,inv:0,plat:null,whirr:0}}
function startLevel(n){
  lvl=n;L=buildLevel(n);P=newPlayer(L.start.x,L.start.y);P.spawn={x:L.start.x,y:L.start.y};
  lives=3;timeL=0;parts=[];bubbles=[];cam=0;
}
function puff(x,y,n,col,sp=60,up=30){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*up,life:.4+Math.random()*.3,max:.7,r:2+Math.random()*2.5,col,gr:-20})}
function sparkle(x,y,col){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;parts.push({x,y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,life:.35,max:.35,r:1.6,col,gr:0})}}

function die(force){
  if(P.dead||(P.inv>0&&!force))return;
  bubbles=[{x:P.x+7,y:P.y-30,t:1.3,s:['#@$%!','%&*#!','@#!?§','*$#@!'][Math.floor(Math.random()*4)]}];
  P.dead=1.3;P.vy=-330;P.vx=0;lives--;SFX.hurt();shake=.3;
}
function update(dt){
  stateT+=dt;
  if(state==='title'){P.phase+=dt*13;if(Math.floor(P.phase/Math.PI)!==P.lastStep){P.lastStep=Math.floor(P.phase/Math.PI)}return}
  if(state!=='play')return;
  timeL+=dt;
  for(const p of L.plats){const o=Math.sin(timeL*1.1+p.t)*p.range;
    if(p.vert){const ny=p.y0+o;p.dy=ny-p.y;p.y=ny;p.dx=0}else{const nx=p.x0+o;p.dx=nx-p.x;p.x=nx;p.dy=0}}
  for(const [k,c] of L.crumbles){c.t+=dt;
    if(!c.broken&&c.t>.5){c.broken=true;c.t=0;setTile(c.x,c.y,' ');SFX.stomp();for(let i=0;i<10;i++)parts.push({x:c.x*T+12,y:c.y*T+8,vx:(Math.random()-.5)*90,vy:-Math.random()*90,life:.9,max:.9,r:2.4,col:i%2?'#fbf7f0':'#e8e2d2',gr:260,leaf:1})}
    else if(c.broken&&c.t>3.5&&!(P&&hit(P,{x:c.x*T,y:c.y*T,w:T,h:T}))){setTile(c.x,c.y,'x');L.crumbles.delete(k)}}
  for(const b of bubbles)b.t-=dt;bubbles=bubbles.filter(b=>b.t>0);
  updPlayer(dt);
  for(const e of L.enemies) updEnemy(e,dt);
  for(const s of L.springs) s.sq=Math.max(0,s.sq-dt*4);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gr*dt+(p.gr>0?0:0);p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  const target=Math.max(0,Math.min(L.w*T-W,P.x+P.w/2-W*.42+P.dir*20));
  cam+=(target-cam)*Math.min(1,dt*6);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
}
function updPlayer(dt){
  const p=P;
  if(p.dead>0){
    p.dead-=dt;p.vy+=G*dt;p.y+=p.vy*dt;p.phase+=dt*30;
    if(p.dead<=0){
      if(lives<=0){setState('over');return}
      const c=[...L.checks].reverse().find(c=>c.on);
      const s=c?{x:c.x+4,y:c.y-24}:p.spawn;
      Object.assign(p,newPlayer(s.x,s.y),{spawn:p.spawn,inv:1.2});
    }
    return;
  }
  p.inv=Math.max(0,p.inv-dt);
  let ax=(keys.right?1:0)-(keys.left?1:0);
  if(ax)p.dir=ax;
  const wasSpin=p.spin;
  p.spin=keys.spin&&p.stam>0;
  if(p.spin){p.stam=Math.max(0,p.stam-dt);p.whirr-=dt;if(p.whirr<=0){SFX.whirr();p.whirr=.09}}
  else if(p.ground)p.stam=Math.min(STAM,p.stam+dt*1.3);
  if(p.spin&&!wasSpin)puff(p.x+7,p.y+22,4,'rgba(255,255,255,.8)',90,10);
  // the gait: speed surges and sags with each leg circle
  const surge=1;
  const max=MAXV*(p.spin&&p.ground?.6:1)*(p.ground?surge:1);
  const acc=p.ground?ACC:AIRACC;
  if(ax){
    p.vx+=ax*acc*dt;
    if(Math.abs(p.vx)>max)p.vx=Math.sign(p.vx)*Math.max(max,Math.abs(p.vx)-FRIC*dt);
  }else{const f=(p.ground?FRIC:FRIC*.25)*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f}
  // jump
  p.coyote=p.ground?.14:p.coyote-dt;
  p.buf=keys.jumpPressed?.13:p.buf-dt;keys.jumpPressed=false;
  if(p.buf>0&&p.coyote>0){p.vy=JUMP;p.buf=0;p.coyote=0;p.ground=false;p.cut=true;p.plat=null;SFX.jump();puff(p.x+7,p.y+24,5,'rgba(255,255,255,.7)')}
  if(p.cut&&!keys.jump&&p.vy<-140)p.vy=-140;
  if(p.vy>=0)p.cut=false;
  p.vy+=G*dt;
  if(p.spin&&p.vy>GLIDE)p.vy=GLIDE;
  if(p.vy>MAXFALL)p.vy=MAXFALL;
  // bora: Trieste's wind pushes you back in gusts
  if(L.theme.bora&&p.ground){p.vx-=boraNow()*200*dt}
  // ride platform
  if(p.plat&&p.ground){moveX(p,p.plat.dx);p.y+=p.plat.dy}
  p.plat=null;
  moveX(p,p.vx*dt);
  const wasGround=p.ground;
  moveY(p,p.vy*dt);
  if(p.ground){const ty=Math.floor((p.y+p.h+1)/T);for(let tx=Math.floor(p.x/T);tx<=Math.floor((p.x+p.w-.01)/T);tx++){if(tile(tx,ty)==='x'&&!L.crumbles.has(tx+','+ty))L.crumbles.set(tx+','+ty,{x:tx,y:ty,t:0,broken:false})}}
  if(p.ground&&!wasGround&&!p.spin)puff(p.x+7,p.y+24,3,'rgba(255,255,255,.6)',40,10);
  // leg cycle
  const sp=Math.abs(p.vx);
  if(p.spin)p.phase+=dt*32;
  else if(p.ground&&sp>5)p.phase+=dt*(3.4+sp*.06);
  else if(!p.ground)p.phase+=dt*5;
  else{const tg=Math.round(p.phase/Math.PI)*Math.PI;p.phase+=(tg-p.phase)*Math.min(1,dt*10)}
  const step=Math.floor(p.phase/Math.PI);
  if(step!==p.lastStep){if(p.ground&&sp>20&&!p.spin){SFX.squeak(step&1);puff(p.x+7-p.dir*4,p.y+24,1,'rgba(255,255,255,.55)',30,8)}p.lastStep=step}
  // hazards
  if(p.y>ROWS*T+30){die(true);return}
  const l=Math.floor(p.x/T),r=Math.floor((p.x+p.w)/T),t=Math.floor(p.y/T),b=Math.floor((p.y+p.h)/T);
  for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++){
    const c=tile(tx,ty);
    if(c==='^'&&hit(p,{x:tx*T+4,y:ty*T+12,w:T-8,h:12})){die();return}
    if(c==='v'&&hit(p,{x:tx*T+4,y:ty*T,w:T-8,h:12})){die();return}
    if(c==='~'&&hit(p,{x:tx*T,y:ty*T+8,w:T,h:16})){puff(p.x+7,ty*T+8,12,'rgba(170,220,255,.9)',120,120);die();return}
  }
  // springs
  for(const s of L.springs){
    const top=s.y+T-11;
    if(p.vy>=0&&hit(p,{x:s.x+3,y:top,w:T-6,h:11})&&p.y+p.h<=top+12){p.vy=SPRING;p.cut=false;p.ground=false;s.sq=1;SFX.spring()}
  }
  // coins
  for(const c of L.coins)if(!c.got&&Math.abs(p.x+7-c.x)<14&&Math.abs(p.y+12-c.y)<18){c.got=true;SFX.coin();sparkle(c.x,c.y,'#ffd23f')}
  // checkpoints
  for(const c of L.checks)if(!c.on&&p.x+p.w>c.x+6&&p.x<c.x+18){c.on=true;SFX.check();bubbles=[{say:true,t:3.2,s:tr('quips')[lvl]}];sparkle(c.x+12,c.y-40,'#ffd23f')}
  // enemies
  for(const e of L.enemies){
    if(!e.alive)continue;
    if(p.spin&&hit({x:p.x-9,y:p.y+p.h-13,w:p.w+18,h:14},e)){kick(e,Math.sign(e.x-p.x)||p.dir);continue}
    if(hit(p,e)){
      if(p.vy>0&&p.y+p.h-e.y<11&&e.type!=='s'){
        e.alive=false;e.dead=1;e.flat=true;SFX.stomp();puff(e.x+e.w/2,e.y+e.h,8,e.type==='p'?'#c9cede':'#a9846a',80,60);
        p.vy=keys.jump?-430:-290;p.cut=false;
      }else die();
      if(p.dead)return;
    }
  }
  // door
  if(L.door&&p.x+p.w/2>L.door.x+6&&p.x+p.w/2<L.door.x+T+6&&p.ground){finishLevel()}
}
function boraNow(){return Math.pow(Math.max(0,Math.sin(timeL*.75)),3)}
function kick(e,dir){e.alive=false;e.dead=1.6;e.vx=dir*170;e.vy=-280;SFX.kick();shake=.12;sparkle(e.x+e.w/2,e.y+e.h/2,'#fff7e6');if(e.type==='p')for(let i=0;i<6;i++)parts.push({x:e.x+7,y:e.y+5,vx:(Math.random()-.5)*120,vy:-Math.random()*120,life:.9,max:.9,r:2,col:'#d9dce6',gr:160,leaf:1})}
function updEnemy(e,dt){
  e.ph+=dt*(e.type==='r'?16:e.type==='p'?9:e.type==='g'?14:3);
  if(e.type==='g'&&e.alive){const tt=timeL*1.15+e.seed;e.x=e.x0+Math.sin(tt)*T*3;e.y=e.y0+Math.sin(tt*2.3)*11;e.dir=Math.cos(tt)>0?1:-1;return}
  if(!e.alive){
    if(e.flat){e.dead-=dt;return}

function footCircle(phi,rc){ // circle in the frontal plane, starting and ending on the ground
  const c=Math.cos(phi),sn=Math.sin(phi);

function legLoop(phi,R){ // closed loop out to the side, with a snappy kick at the far point
  const k=(1-Math.cos(phi))/2,kick=Math.pow(k,5);
  return {x:R*.95*k+R*.2*kick, y:-R*.7*k-R*.3*Math.sin(phi), out:k, kick};

  g.fillStyle='rgba(255,247,230,.3)';rr(8,24,48,6,3);g.fill();g.fillStyle=P.stam<STAM*.3?'#ff5a3c':'#ffd23f';rr(8,24,48*P.stam/STAM,6,3);g.fill();
  drawCoin({x:70,y:14,ph:0},0,0);
  const got=L.coins.filter(c=>c.got).length;
  outlineText(`${got}/${L.total}`,82,15,'#fff7e6');
  const m=Math.floor(timeL/60),s=Math.floor(timeL%60);
  outlineText(`${m}:${String(s).padStart(2,'0')}`,140,15,'#fff7e6');
  g.textAlign='right';outlineText(`${lvl+1}. ${tr('names')[lvl]}`,W-36,15,'#ffd23f');g.textAlign='left';
  if(L.theme.bora&&boraNow()>.35){g.textAlign='center';outlineText('BORA!',W/2,15,'#bfe6ff');g.textAlign='left'}
  g.textBaseline='alphabetic';
}
function outlineText(s,x,y,c){g.lineWidth=3;g.strokeStyle='rgba(18,11,34,.8)';g.strokeText(s,x,y);g.fillStyle=c;g.fillText(s,x,y)}

/* title demo scene */
function drawTitle(t){
  drawBg(L.theme,t*40,t);
  g.fillStyle=L.theme.dirt;g.fillRect(0,236,W,52);g.fillStyle=L.theme.grass;g.fillRect(0,236,W,7);
  for(let x=-((t*40)%6);x<W;x+=6){g.beginPath();g.arc(x+3,243,3.2,0,Math.PI);g.fill()}
  const sp=Math.floor(t*13/Math.PI);if(sp!==drawTitle.last){drawTitle.last=sp}
  drawGuy(436,236,-1,t*13,false,t,1);
  speech(434,184,SAYS[Math.floor(t/1.6)%2]);
}

/* ---------------- screens ---------------- */
function html(s){screen.innerHTML=s;screen.hidden=false;const b=screen.querySelector('[data-primary]');if(b)try{b.focus({preventScroll:true})}catch(e){}}
function fmt(s){return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function setState(s){
  state=s;stateT=0;for(const k in keys)keys[k]=false;
  pauseBtn.hidden=s!=='play';
  touchPad.hidden=!(coarse&&s==='play');
  document.getElementById('tJump').textContent=tr('jump');document.getElementById('tSpin').textContent=tr('spin');
  screen.classList.toggle('dim',s!=='play'&&s!=='splash'&&s!=='title');
  if(s==='splash'){screen.classList.add('dim');screen.style.background='#120b22';html(`<p class="kanji">心</p><p class="studio">KOKORO STUDIO</p>`);return}
  screen.style.background='';
  if(s==='title'){
    L=buildLevel(0);P=newPlayer(0,0);
    let lv='';for(let i=0;i<THEMES.length;i++){const b=best['l'+i];lv+=`<button class="lv" data-act="lv" data-n="${i}" ${i<unlocked?'':'disabled'} title="${tr('names')[i]}${b?` · ${b.c} · ${fmt(b.t)}`:''}">${i+1}</button>`}
    html(`<h1 class="big">TRIESTE HOP</h1><p class="txt" style="font-weight:700">${tr('tag')}</p>
      <div class="row"><button class="b" data-act="play" data-primary>${tr('play')}</button></div>
      ${unlocked>1?`<div class="row" aria-label="${tr('levels')}">${lv}</div>`:''}
      <div class="row"><button class="b alt" data-act="mute">${tr('sound')}: ${muted?tr('off'):tr('on')}</button></div>
      <p class="small">${coarse?'':tr('keys')}</p>`);
    screen.style.justifyContent='flex-start';screen.style.paddingTop='calc(var(--u)*26)';
    return;
  }
  screen.style.justifyContent='';screen.style.paddingTop='';
  if(s==='install'){
    const steps=isIOS
      ?`<li>Tocca il pulsante <b>Condividi</b> (il quadrato con la freccia verso l'alto) nella barra di Safari.</li><li>Scorri e scegli <b>Aggiungi alla schermata Home</b>.</li><li>Conferma con <b>Aggiungi</b>: l'icona di Trieste Hop compare sulla Home e il gioco si apre a schermo intero.</li>`
      :`<li>Tocca il menu <b>⋮</b> in alto a destra in Chrome.</li><li>Scegli <b>Installa app</b> oppure <b>Aggiungi a schermata Home</b>.</li><li>Conferma: l'icona di Trieste Hop compare sulla Home e il gioco si apre a schermo intero.</li>`;
    html(`<h2 class="mid">Salva Trieste Hop sulla Home</h2>
      ${inApp?`<p class="txt" style="color:var(--sun)">Sei dentro WhatsApp: prima apri il link nel browser (${isIOS?'icona della bussola o «Apri in Safari»':'menu ⋮ → «Apri in Chrome»'}).</p>`:''}
      <ol class="txt inst">${steps}</ol>
      <div class="row">${installEvt?`<button class="b on" data-act="doinstall">Installa ora</button>`:''}<button class="b" data-act="skipinstall" data-primary>Gioca subito</button><button class="b alt" data-act="noinstall">Non mostrare più</button></div>`);return;
  }
  if(s==='intro'){
    html(`<h2 class="mid">${tr('introT')}</h2><p class="txt" style="max-width:calc(var(--u)*430);font-size:calc(var(--u)*10.6);line-height:1.36">${tr('intro')}</p><div class="row"><button class="b" data-act="tocard" data-primary>${tr('cont')}</button></div>`);return;
  }
  if(s==='card'){
    html(`<p class="small">${tr('lvl').toUpperCase()} ${lvl+1} / ${THEMES.length}</p><h2 class="big" style="font-size:calc(var(--u)*26)">${tr('names')[lvl]}</h2>
      <p class="txt story">${tr('stories')[lvl]}</p>
      <p class="txt tip">${tr('tips')[lvl]}</p>
      <div class="row"><button class="b" data-act="go" data-primary>${tr('go')}</button></div>`);return;
  }
  if(s==='play'||s==='win'){screen.hidden=true;screen.innerHTML='';return}
  if(s==='pause'){html(`<h2 class="mid">${tr('pause')}</h2><div class="row"><button class="b" data-act="resume" data-primary>${tr('resume')}</button><button class="b alt" data-act="restart">${tr('restart')}</button><button class="b alt" data-act="menu">${tr('menu')}</button></div><p class="small">${coarse?'':tr('keys')}</p>`);return}
  if(s==='done'){const got=L.coins.filter(c=>c.got).length;
    const ou=tr('outros')[lvl];html(`<h2 class="mid">${tr('done')}</h2>${ou?`<p class="txt" style="font-style:italic">${ou}</p>`:''}<p class="txt">${tr('cornetti')}: <b>${got}/${L.total}</b> · ${tr('time')}: <b>${fmt(timeL)}</b></p><div class="row"><button class="b" data-act="next" data-primary>${tr('next')}</button><button class="b alt" data-act="menu">${tr('menu')}</button></div>`);return}
  if(s==='over'){html(`<h2 class="mid">${tr('over')}</h2><p class="txt">${tr('overTxt')}</p><div class="row"><button class="b" data-act="restart" data-primary>${tr('retry')}</button><button class="b alt" data-act="menu">${tr('menu')}</button></div>`);return}
  if(s==='end'){let tot=0,all=0;for(let i=0;i<THEMES.length;i++){const b=best['l'+i];if(b)tot+=b.c}
    html(`<h2 class="big" style="font-size:calc(var(--u)*32)">${tr('endT')}</h2><p class="txt">${tr('end')}</p><p class="txt" style="color:var(--sun)">${tr('cornetti')}: <b>${tot}</b></p><div class="row"><button class="b" data-act="menu" data-primary>${tr('menu')}</button></div>`);return}
}
/* install-to-home-screen guide, shown on phones when the game is opened from a link */
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inApp=/WhatsApp|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
function afterSplash(){if(coarse&&!standalone()&&!store.get('noInstall',false))setState('install');else setState('title')}
function togglePause(){if(state==='play')setState('pause');else if(state==='pause')setState('play')}
pauseBtn.addEventListener('click',togglePause);
screen.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(state==='splash'){afterSplash();return}
  if(!b)return;
  const a=b.dataset.act;snd(660,.05,'square',.03);
  if(a==='play'){startLevel(Math.min(unlocked-1,THEMES.length-1));if(unlocked>=THEMES.length&&best['l'+(THEMES.length-1)])startLevel(0);setState(lvl===0?'intro':'card')}
  else if(a==='lv'){startLevel(+b.dataset.n);setState(+b.dataset.n===0?'intro':'card')}
  else if(a==='tocard'){setState('card')}
  else if(a==='skipinstall'){setState('title')}
  else if(a==='noinstall'){store.set('noInstall',true);setState('title')}
  else if(a==='doinstall'){const e=installEvt;installEvt=null;if(e){e.prompt();e.userChoice.finally(()=>setState('title'))}else setState('title')}
  else if(a==='lang'){lang=b.dataset.l;store.set('lang',lang);setState('title')}
  else if(a==='mute'){muted=!muted;store.set('muted',muted);if(muted)stopMusic();else startMusic();setState('title')}
  else if(a==='go'){setState('play')}
  else if(a==='resume'){setState('play')}
  else if(a==='restart'){startLevel(lvl);setState('card')}
  else if(a==='menu'){setState('title')}
  else if(a==='next'){startLevel(lvl+1);setState('card')}
});
addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setState('pause')});
const portrait=matchMedia('(orientation:portrait) and (pointer:coarse)');
const onRot=()=>{if(portrait.matches&&state==='play')setState('pause')};
try{portrait.addEventListener('change',onRot)}catch(e){portrait.addListener&&portrait.addListener(onRot)}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0,clock=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  acc+=dt;const STEP=1/120;
  while(acc>=STEP){update(STEP);acc-=STEP}
  g.clearRect(0,0,W,H);
  if(state==='splash'){g.fillStyle='#120b22';g.fillRect(0,0,W,H);if(stateT>1.8)afterSplash()}
  else if(state==='title')drawTitle(clock);
  else if(L){drawWorld(clock);if(state==='play'||state==='pause'||state==='win')drawHUD(clock);
    if(state==='win'){speech(P.x-cam+7,P.y-42,SAYS[stateT<1.3?0:1]);if(stateT>2.7)setState(winNext)}}
  requestAnimationFrame(frame);
}
function boot(data){
  if(data&&typeof data.lvl==='number'&&data.state==='play'){startLevel(data.lvl);setState('card')}
  else setState('splash');
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({lvl,state}));
const hot=window.claude?.hot;
hot?.ready?hot.ready(boot):boot(hot?.data??{});
})();
</script>
